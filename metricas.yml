name: Actualizar metricas

on:
  schedule:
    - cron: "0 12 * * 1"     # todos los lunes a las 9 de la mañana (hora Argentina): todo
    - cron: "*/10 * * * *"   # cada 10 minutos: si estoy en vivo, anota los espectadores
  workflow_dispatch:        # botón para correrlo a mano

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Buscar los números
        run: node metricas.mjs
        env:
          MODO: ${{ github.event.schedule == '*/10 * * * *' && 'vivo' || 'completo' }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          IG_TOKEN_PRINCIPAL: ${{ secrets.IG_TOKEN_PRINCIPAL }}
          IG_TOKEN_GAMING: ${{ secrets.IG_TOKEN_GAMING }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
      - name: Guardar si cambió algo
        run: |
          git config user.name "robot-godcita"
          git config user.email "robot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Métricas actualizadas" && git pull --rebase && git push)
